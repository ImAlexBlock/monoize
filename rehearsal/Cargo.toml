[package]
name = "monoize-lynshen-rehearsal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = "0.4.45"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.8.5"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "rust_decimal"] }
sysinfo = "0.39.6"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.25.0", features = ["v4", "serde"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[dev-dependencies]
async-trait = "0.1"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-chrono"] }
